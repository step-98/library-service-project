services:
  library:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - my_media:/app/media
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - library_db


  library_db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - my_db:/var/lib/postgresql/data

  redis:
    image: "redis:alpine"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: "celery -A library_service_project worker -l info"
    depends_on:
      - library
      - redis
      - library_db
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./:/app
      - my_media:/app/media

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py wait_for_db &&
            celery -A library_service_project beat -l INFO -s /tmp/celerybeat-schedule"
    depends_on:
      - library
      - redis
      - library_db
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./:/app
      - my_media:/app/media

volumes:
  my_db:
  my_media:
